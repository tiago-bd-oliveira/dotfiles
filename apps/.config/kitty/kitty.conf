# Window Settings
background_opacity 0.8
window_padding_width 10 0


# Font Settings
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0


# Color Scheme (Nord)

# Primary
background #2e3440
foreground #d8dee9

# Cursor
cursor            #d8dee9
cursor_text_color #2e3440
cursor_trail 1

# Selection
selection_foreground none
selection_background #4c566a

# Search (Mapping approximate matches to Kitty search colors)
url_color #88c0d0
url_style straight

# The 16-Color Palette

# Normal Colors (0-7)
color0 #3b4252
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0

# Bright Colors (8-15)
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4

# no annoying bell
enable_audio_bell no

mouse_hide_wait 1

sync_monitor yes

input_delay 0

confirm_os_window_close 0
