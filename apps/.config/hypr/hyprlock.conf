# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# BACKGROUND
background {
    monitor =
    path = /home/tiago/Pictures/wallpapers/a_cartoon_of_a_boy_sleeping_on_a_tree_branch.jpg
    color = rgba(14, 32, 26, 1.0)

    # Blur
    blur_passes = 1 # 0 disables blurring
    blur_size = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0

}

image {
    monitor =
    path = ~/.config/hypr/hyprlock/profile.jpeg
    size = 400
    rounding = 20 # -1 = circle
    border_size = 2
    border_color = rgb(194, 199, 197)
    position = 0, 100
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 70
    rounding = 10
    outline_thickness = 2

    dots_text_format =
    dots_text_change = true
    dots_size = 0.35 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

    outer_color = rgba(194, 199, 197, 1.0)
    inner_color = rgba(14, 32, 26, 0.9)
    font_color = rgb(194, 199, 197)
    font_family = JetBrains Mono Nerd Font Mono

    placeholder_text = <i><span foreground="##595959">Input Password...</span></i>

    hide_input = false
    position = 0, -300
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(194, 199, 197, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -270
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(194, 199, 197, 0.8)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -250
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = Welcome back, $USER!
    color = rgba(194, 199, 197, 0.8)
    font_size = 25
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, -180
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/song-status.sh
    color = rgba(194, 199, 197, 0.8)
    font_size = 25
    font_family = JetBrains Mono Nerd Font Mono
    position = 0, 50
    halign = center
    valign = bottom
}
