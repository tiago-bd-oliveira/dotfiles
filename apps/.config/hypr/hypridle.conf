general {
    # Command to run when the lock signal is sent (e.g., by systemd before sleep)
    lock_cmd = pidof hyprlock || hyprlock

    # Lock the screen *before* the system goes to sleep
    before_sleep_cmd = loginctl lock-session

    # Turn the display on immediately when waking up
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim screen after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10         # Save current brightness, set to 10%
    on-resume = brightnessctl -r                 # Restore previous brightness
}

# 2. Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session           # Triggers the 'lock_cmd' defined above
}

# 3. Turn off screen after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off       # Screen off
    on-resume = hyprctl dispatch dpms on         # Screen on
}

# 4. Suspend PC after 30 minutes (1800s)
listener {
    timeout = 1800
    on-timeout = systemctl suspend               # Suspend the system
}